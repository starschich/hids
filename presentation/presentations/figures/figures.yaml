# Figures of the presentations in this folder, drawn live with the Glyphwright
# symbol library from ~/hids/template/glyphwright (loaded by \usepackage{glyphwright}).
# Regenerate after diagram or symbol changes (from the Glyphwright repository):
#   python tools/deck_figures.py --no-library ~/hids/presentation/presentations/figures/figures.yaml
#   python -m glyphwright texlib ~/hids/template/glyphwright --sld ~/hids/presentation/presentations/figures/src/smp_level_1.yaml
# 'scale' shrinks the geometry only; line widths and texts keep their size.

slds:
  smp_level_1: {file: src/smp_level_1.yaml, scale: 0.6}
